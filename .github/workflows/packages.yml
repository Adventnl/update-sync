name: Desktop packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles nsis
      - name: Build macOS app
        if: runner.os == 'macOS'
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Make portable Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packages | Out-Null
          $release = 'target/${{ matrix.target }}/release'
          if (!(Test-Path "$release/toolchains/node/node.exe") -or !(Test-Path "$release/toolchains/node/node_modules/npm/bin/npm-cli.js")) { throw 'Bundled Node/npm is missing' }
          Compress-Archive -LiteralPath "$release/relay.exe", "$release/toolchains" -DestinationPath packages/Relay-${{ matrix.name }}.zip
          Copy-Item -Path target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe -Destination packages
          Get-ChildItem packages -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content packages/SHA256SUMS
      - name: Make macOS ZIP
        if: runner.os == 'macOS'
        run: |
          mkdir -p packages
          test -x target/${{ matrix.target }}/release/bundle/macos/Relay.app/Contents/Resources/toolchains/node/bin/node
          test -f target/${{ matrix.target }}/release/bundle/macos/Relay.app/Contents/Resources/toolchains/node/lib/node_modules/npm/bin/npm-cli.js
          ditto -c -k --keepParent target/${{ matrix.target }}/release/bundle/macos/Relay.app packages/Relay-${{ matrix.name }}.zip
          shasum -a 256 packages/*.zip > packages/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Relay-${{ matrix.name }}
          path: packages/*
          retention-days: 7
          if-no-files-found: error
